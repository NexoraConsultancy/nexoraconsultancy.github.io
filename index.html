<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA CONSULTANCY 2026 | Career & Talent Solutions</title>
<meta name="description" content="Nexora Consultancy 2026 — professional recruitment, placement, training and career solutions across IT and Non-IT sectors.">

<style>
:root{
  --ink:#10212b;
  --navy:#071b2a;
  --navy2:#0d3040;
  --blue:#087ea4;
  --cyan:#36c2c8;
  --gold:#e2b44f;
  --paper:#f3f7f8;
  --white:#fff;
  --muted:#647781;
  --line:rgba(16,33,43,.11);
  --shadow:0 22px 70px rgba(7,27,42,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--ink);background:linear-gradient(180deg,#f6f9fa 0%,#eef4f5 52%,#f8fafb 100%);overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
img{max-width:100%}

/* subtle page grain */
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
}
header{
  position:fixed;top:0;left:0;width:100%;z-index:1000;
  background:rgba(7,22,36,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(255,255,255,.09);transition:.45s;
}
header.scrolled{background:rgba(7,22,36,.94);box-shadow:0 12px 40px rgba(0,0,0,.18)}
.nav{
  max-width:1280px;margin:auto;min-height:82px;padding:0 5%;
  display:flex;align-items:center;justify-content:space-between;gap:28px;
}
.brand{display:flex;align-items:center;gap:12px;order:2}
.logo{
  width:48px;height:48px;border-radius:15px;position:relative;display:grid;place-items:center;
  background:linear-gradient(145deg,#082738,#0b5f72 62%,#168f9a);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.18),0 10px 35px rgba(8,126,164,.24);
  transform-style:preserve-3d;animation:logoFloat 4s ease-in-out infinite;overflow:hidden;
}
.logo:before{
  content:"";position:absolute;width:27px;height:27px;border-radius:50%;
  border:2px solid rgba(226,180,79,.92);box-shadow:0 0 18px rgba(226,180,79,.28);
}
.logo:after{
  content:"";position:absolute;inset:5px;border-radius:11px;
  border:1px solid rgba(255,255,255,.12);
}
.logo span{position:relative;z-index:2;font-size:21px;font-weight:950;line-height:1;color:#fff;letter-spacing:-.5px;text-shadow:0 2px 8px rgba(0,0,0,.25)}

@keyframes logoFloat{
  0%,100%{transform:translateY(0) rotateX(0) rotateY(0)}
  50%{transform:translateY(-4px) rotateX(4deg) rotateY(-6deg)}
}
.brand-text strong{display:block;color:#fff;font-size:17px;letter-spacing:1.4px}
.brand-text strong b{color:var(--cyan)}
.brand-text small{display:block;color:#9fb4c5;font-size:8px;letter-spacing:3px;margin-top:3px}
nav{display:flex;gap:26px;order:1}
nav a{font-size:12px;font-weight:800;letter-spacing:.5px;color:#d8e4ec;position:relative;padding:8px 0}
nav a:after{content:"";position:absolute;left:0;bottom:1px;width:0;height:2px;background:var(--cyan);transition:.35s}
nav a:hover{color:#fff} nav a:hover:after{width:100%}
.menu{display:none;background:none;border:0;color:#fff;font-size:29px;order:1}

/* HERO */
.hero{
  min-height:100svh;position:relative;display:flex;align-items:center;overflow:hidden;
  background:
    linear-gradient(90deg,rgba(4,17,29,.97) 0%,rgba(4,17,29,.84) 42%,rgba(4,17,29,.42) 100%),
    url("https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=2200&q=88");
  background-size:cover;background-position:center;
}
.hero:after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 78% 30%,rgba(22,169,232,.25),transparent 26%),
             linear-gradient(transparent 60%,rgba(0,0,0,.35));
}
.gridglow{
  position:absolute;width:600px;height:600px;right:-220px;top:12%;
  border:1px solid rgba(87,220,255,.14);border-radius:50%;
  box-shadow:0 0 0 60px rgba(87,220,255,.025),0 0 0 120px rgba(87,220,255,.018);
  animation:orbit 12s linear infinite;
}
@keyframes orbit{to{transform:rotate(360deg)}}
.hero-inner{max-width:1280px;width:100%;margin:auto;padding:145px 5% 90px;position:relative;z-index:2}
.kicker{
  display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.25);
  padding:9px 15px;border-radius:99px;background:rgba(255,255,255,.07);color:#a8eaff;
  font-size:10px;font-weight:900;letter-spacing:2.4px;margin-bottom:25px;
}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px var(--cyan);animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.55}}
.hero h1{max-width:820px;color:#fff;font-size:clamp(45px,7.2vw,88px);line-height:.98;letter-spacing:-3px}
.hero h1 span{color:var(--cyan)}
.hero h2{color:#edf9ff;font-size:clamp(20px,2.8vw,30px);margin:24px 0 17px}
.hero p{max-width:720px;color:#c5d6e2;font-size:16px;line-height:1.9}
.actions{display:flex;flex-wrap:wrap;gap:13px;margin-top:32px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border-radius:10px;
  font-size:13px;font-weight:900;transition:.35s;border:1px solid transparent
}
.primary{background:linear-gradient(135deg,#0787c9,#27c4f2);color:#fff;box-shadow:0 12px 32px rgba(22,169,232,.26)}
.primary:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(22,169,232,.38)}
.ghost{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.06);color:#fff}
.ghost:hover{background:#fff;color:var(--ink)}
.hero-stats{display:flex;gap:35px;margin-top:55px;flex-wrap:wrap}
.stat{padding-left:15px;border-left:2px solid rgba(87,220,255,.65)}
.stat strong{display:block;color:#fff;font-size:21px}.stat span{color:#91aabb;font-size:10px;letter-spacing:1px;text-transform:uppercase}

/* COMMON */
section{padding:105px 5%}
.container{max-width:1180px;margin:auto}
.section-head{max-width:750px;margin:0 auto 55px;text-align:center}
.eyebrow{color:#0787c9;font-size:10px;font-weight:900;letter-spacing:2.7px;text-transform:uppercase}
.section-head h2{font-size:clamp(32px,5vw,54px);line-height:1.05;margin:11px 0 15px;letter-spacing:-1.7px}
.section-head p{color:var(--muted);line-height:1.8}
.reveal{opacity:0;transform:translateY(35px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.show{opacity:1;transform:none}

/* ABOUT */
.about{background:#fff}
.about-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:70px;align-items:center}
.visual{
  min-height:490px;border-radius:26px;overflow:hidden;position:relative;
  background:
    linear-gradient(135deg,rgba(4,27,44,.15),rgba(4,27,44,.42)),
    linear-gradient(145deg,#071b2b,#0a3d52 55%,#0c1b29);
  background-size:cover;background-position:center;box-shadow:var(--shadow);
}
.visual:before{content:"";position:absolute;inset:18px;border:1px solid rgba(255,255,255,.4);border-radius:19px}
.float-card{
  position:absolute;left:24px;bottom:24px;background:rgba(5,25,40,.82);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.18);border-radius:15px;padding:17px 20px;color:#fff;
  animation:cardFloat 4s ease-in-out infinite
}
.float-card strong{display:block;color:#72e5ff;font-size:21px}.float-card small{color:#c9d9e4}
@keyframes cardFloat{50%{transform:translateY(-8px)}}
.about-copy h3{font-size:34px;line-height:1.15;margin-bottom:17px}
.about-copy p{color:#62778a;line-height:1.85;margin-bottom:16px}
.line{width:72px;height:4px;border-radius:10px;background:linear-gradient(90deg,var(--cyan),var(--gold));margin:24px 0}

/* FOUNDERS */
.founders{background:linear-gradient(135deg,#edf7fb,#fff)}
.founder-layout{display:grid;grid-template-columns:.7fr 1.3fr;gap:65px;align-items:center}
.founder-title h2{font-size:clamp(38px,5vw,60px);line-height:1.0;letter-spacing:-2px}
.founder-title p{color:var(--muted);line-height:1.8;margin-top:18px}
.founder-list{display:grid;gap:18px}
.founder{
  display:flex;align-items:center;gap:20px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;
  box-shadow:0 10px 30px rgba(8,24,39,.05);transition:.45s;position:relative;overflow:hidden
}
.founder:before{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:linear-gradient(var(--blue),var(--gold))}
.founder:hover{transform:translateX(10px);box-shadow:0 20px 45px rgba(8,24,39,.11)}
.avatar{width:72px;height:72px;flex:0 0 72px;border-radius:20px;display:grid;place-items:center;color:#fff;font-weight:950;font-size:22px;background:linear-gradient(145deg,#0a557b,#19b9ef);box-shadow:inset 0 2px 4px rgba(255,255,255,.35)}
.founder small{display:block;color:#0787c9;font-size:9px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.founder h3{font-size:24px;letter-spacing:-.4px}.founder p{color:#778b9b;font-size:12px;margin-top:5px}

/* SERVICES */
.services{background:#f5f9fc}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:19px;padding:29px;position:relative;overflow:hidden;
  transition:.4s;box-shadow:0 8px 25px rgba(8,24,39,.04)
}
.card:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-65px;top:-65px;background:rgba(22,169,232,.08);transition:.4s}
.card:hover{transform:translateY(-9px);box-shadow:0 24px 45px rgba(8,24,39,.11)}
.card:hover:after{transform:scale(1.4)}
.icon{width:55px;height:55px;border-radius:15px;display:grid;place-items:center;background:#e7f7fd;color:#0787c9;font-weight:950;font-size:21px;margin-bottom:20px}
.card h3{font-size:19px;margin-bottom:9px}.card p{color:#687d8e;line-height:1.7;font-size:13px}

/* DARK WHY */
.why{
  color:#fff;background:
  linear-gradient(120deg,rgba(3,18,31,.96),rgba(7,52,78,.92)),
  url("https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1900&q=88");
  background-size:cover;background-position:center;background-attachment:scroll
}
.why .section-head p{color:#b6cad8}.why .eyebrow{color:#62ddff}.why .section-head h2{color:#fff}
.why .card{background:rgba(255,255,255,.065);border-color:rgba(255,255,255,.13);backdrop-filter:blur(10px);color:#fff}
.why .card h3{color:#fff}.why .card p{color:#b7cbd8}.why .icon{background:rgba(87,220,255,.13);color:#68dcff}

/* PROCESS */
.process{background:#fff}
.process-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.step{text-align:center;padding:15px}
.num{width:58px;height:58px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:950;background:linear-gradient(145deg,#087ebc,#35c7ef);box-shadow:0 10px 25px rgba(22,169,232,.2)}
.step h3{font-size:15px;margin-bottom:7px}.step p{color:#74899a;font-size:12px;line-height:1.6}

/* JOBS */
.jobs{background:#f5f9fc}
.jobs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.job{background:#fff;border:1px solid var(--line);border-radius:19px;padding:27px;transition:.4s}
.job:hover{transform:translateY(-7px);box-shadow:var(--shadow)}
.job-top{display:flex;justify-content:space-between;gap:12px}.job h3{font-size:20px}.tag{font-size:9px;font-weight:900;color:#0787c9;background:#e7f7fd;padding:7px 10px;border-radius:30px;white-space:nowrap}
.job p{color:#6b8090;font-size:13px;line-height:1.7;margin-top:14px}
.apply{display:inline-flex;margin-top:18px;color:#0787c9;font-size:12px;font-weight:900}

/* JOB FILTERS & CANDIDATE PORTAL */
.job-filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.2fr;gap:10px;margin:0 auto 20px}
.job-filters input,.job-filters select{width:100%;border:1px solid #cbd9e3;border-radius:11px;padding:13px 12px;background:#fff;color:#173149;outline:none}
.job-filters input:focus,.job-filters select:focus{border-color:#16a9e8;box-shadow:0 0 0 4px rgba(22,169,232,.08)}
.job-portal-status{display:flex;justify-content:space-between;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:20px}
.job-portal-status strong{font-size:13px}.job-portal-status span{font-size:11px;color:#718697}
.job-empty{grid-column:1/-1;text-align:center}
.candidate-notice{display:grid;gap:6px;background:#eef8fc;border:1px solid #cfeaf5;border-radius:14px;padding:16px;margin-bottom:18px}
.candidate-notice strong{font-size:12px;color:#14344b}.candidate-notice span{font-size:11px;color:#60788a;line-height:1.6}
.candidate-easy-panel{border:1px solid #cfe3eb;border-radius:18px;padding:20px;background:linear-gradient(135deg,#f8fcfd,#eef8fb);margin-bottom:16px}.candidate-easy-head{display:flex;gap:14px;align-items:center}.candidate-easy-head h3{font-size:18px;margin-bottom:4px}.candidate-easy-head p{font-size:11px;color:#6d8291;line-height:1.6}.easy-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.easy-grid>div{background:#fff;border:1px solid #dce9ef;border-radius:12px;padding:13px}.easy-grid strong{display:block;font-size:11px;color:#15364b;margin-bottom:5px}.easy-grid span{display:block;font-size:10px;color:#708594;line-height:1.5}.easy-note{margin-top:12px;padding:11px 13px;border-radius:11px;background:#fff7e4;border:1px solid #f0d89a;color:#6e5a2b;font-size:10px;line-height:1.5}.easy-note b{color:#4f3b12}
.airtable-connect{display:flex;gap:15px;align-items:center;border:1px solid #d8e3ea;border-radius:16px;padding:18px;background:#fff}
.airtable-icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#0a557b,#19b9ef);color:#fff;font-weight:950}
.airtable-connect h3{font-size:17px;margin-bottom:5px}.airtable-connect p{font-size:11px;color:#708596;line-height:1.6}
.form-link{margin-top:18px}.form-connect-note{font-size:10px;color:#7a8c9a;line-height:1.5;margin-top:10px}
\n/* APPLICATION */
.apply-section{
  background:
    linear-gradient(135deg,rgba(5,24,40,.96),rgba(8,62,88,.94)),
    url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1800&q=88");
  background-size:cover;background-position:center
}
.form-wrap{max-width:950px;margin:auto;background:rgba(255,255,255,.97);border-radius:28px;padding:35px;box-shadow:0 30px 80px rgba(0,0,0,.24)}
.form-head{text-align:center;margin-bottom:28px}.form-head h2{font-size:clamp(30px,5vw,48px);letter-spacing:-1.5px}.form-head p{color:var(--muted);margin-top:9px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:900;letter-spacing:.7px;color:#20384c}
.field input,.field select,.field textarea{
  width:100%;border:1px solid #cbd9e3;border-radius:11px;padding:14px 14px;outline:none;background:#f8fbfd;color:#102b40;transition:.25s
}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#16a9e8;box-shadow:0 0 0 4px rgba(22,169,232,.10);background:#fff}
.submit-row{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:22px}
.note{font-size:10px;color:#738899;line-height:1.5}
.submit-row .btn{border:0;cursor:pointer}

/* TALLY APPLICATION EMBED */
.tally-embed-wrap{
  width:100%;
  overflow:hidden;
  border-radius:18px;
  background:#fff;
}
.tally-embed-wrap iframe{
  display:block;
  width:100%;
  min-height:2200px;
  border:0;
  background:#fff;
}

/* CONTACT */
.contact{background:#fff}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.contact-box{border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 10px 30px rgba(8,24,39,.04)}
.contact-box h3{font-size:25px;margin-bottom:20px}
.contact-item{display:flex;gap:13px;align-items:center;margin:17px 0}.contact-icon{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:#e7f7fd;color:#0787c9;font-weight:900}
.contact-item strong{display:block;font-size:12px}.contact-item span,.contact-item a{font-size:13px;color:#687d8e}
.contact-item a:hover{color:#0787c9}

/* SOCIAL */
.social{padding:65px 5%;text-align:center;background:#edf5f9}
.social h2{font-size:30px}.social p{color:var(--muted);margin:8px 0 24px}
.socials{display:flex;justify-content:center;gap:12px}
.social a{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;color:#fff;font-weight:950;transition:.35s;box-shadow:0 10px 25px rgba(8,24,39,.13)}
.social a:hover{transform:translateY(-7px) rotate(-2deg)}
.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)} .wa{background:#18b957}.mail{background:#168ed0}

/* FOOTER */
footer{background:#061522;color:#9cb0bf;padding:45px 5% 28px;text-align:center}
.footer-brand{color:#fff;font-weight:950;font-size:23px;letter-spacing:1.2px}.footer-brand b{color:var(--cyan)}
footer p{font-size:11px;margin-top:8px;color:#91a6b6}.copyright{margin-top:22px;font-size:10px;color:#607889}

/* MOBILE */
@media(max-width:900px){
  nav{display:none;position:absolute;left:0;top:82px;width:100%;padding:20px 6%;background:rgba(7,22,36,.98);flex-direction:column;gap:8px}
  nav.open{display:flex}.menu{display:block}
  .brand{order:2}.menu{order:1}
  .about-grid,.founder-layout,.contact-grid{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr 1fr}.process-grid{grid-template-columns:1fr 1fr}.jobs-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .nav{min-height:72px}.logo{width:42px;height:42px}.brand-text strong{font-size:14px}.brand-text small{font-size:7px}
  nav{top:72px}.hero-inner{padding:125px 6% 70px}.hero h1{font-size:44px;letter-spacing:-2px}
  .hero p{font-size:14px}.hero-stats{gap:20px;margin-top:38px}
  section{padding:75px 5%}.visual{min-height:340px}.cards,.process-grid{grid-template-columns:1fr}.easy-grid{grid-template-columns:1fr}
  .founder{padding:20px}.form-wrap{padding:22px 17px;border-radius:20px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
  .submit-row{align-items:stretch;flex-direction:column}.submit-row .btn{width:100%}
}

<style>

 radial-gradient(circle at 18% 75%,rgba(218,171,70,.12),transparent 24%),
 linear-gradient(145deg,#02050b 0%,#061320 48%,#02050b 100%);color:#fff;border-top:1px solid rgba(255,255,255,.1)}
.vfx-footer:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(39,212,230,.035) 50%,transparent 100%);animation:vfxBreath 7s ease-in-out infinite}
#vfxCanvas{position:absolute;inset:0;width:100%;height:100%;opacity:.95}

.footer-kicker span:last-child{background:linear-gradient(90deg,#d7b35b,transparent)}
.footer-logo-stage{height:280px;position:relative;display:grid;place-items:center;perspective:900px}
.footer-mark{width:88px;height:88px;border-radius:28px;display:grid;place-items:center;position:absolute;top:40px;z-index:4;background:linear-gradient(145deg,#071c2b,#0d6c82 60%,#22d1dd);border:1px solid rgba(255,255,255,.24);box-shadow:0 0 0 1px rgba(215,179,91,.12),0 0 55px rgba(28,210,227,.35),inset 0 2px 12px rgba(255,255,255,.2);transform:translateZ(50px) rotateX(8deg);animation:markFloat 4s ease-in-out infinite}
.footer-mark
