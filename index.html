<style>

/* =========================================================
   NEXORA FULL-PAGE CINEMATIC VFX / 3D EXPERIENCE
   Visual-only upgrade: preserves existing content/functions.
   ========================================================= */
:root{
  --vfx-bg:#030b14;
  --vfx-bg2:#071827;
  --vfx-panel:rgba(8,23,36,.72);
  --vfx-panel2:rgba(10,31,46,.58);
  --vfx-line:rgba(112,225,238,.16);
  --vfx-cyan:#2bd6e6;
  --vfx-gold:#d7b35b;
  --vfx-white:#f5fbff;
  --vfx-muted:#91a9b8;
  --vfx-shadow:0 30px 90px rgba(0,0,0,.42);
}
html{background:var(--vfx-bg)}
body{
  color:var(--vfx-white)!important;
  background:
    radial-gradient(900px 500px at 8% 6%,rgba(20,171,202,.10),transparent 65%),
    radial-gradient(800px 500px at 92% 18%,rgba(215,179,91,.08),transparent 68%),
    linear-gradient(180deg,#020812 0%,#061521 32%,#030c16 68%,#020812 100%)!important;
}
body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9996;
  opacity:.20;
  background:
    linear-gradient(rgba(77,221,235,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(77,221,235,.035) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent);
  animation:vfxGrid 18s linear infinite;
}
body:before{
  z-index:9997!important;
  opacity:.035!important;
}
@keyframes vfxGrid{to{background-position:56px 56px}}

header{
  background:rgba(2,10,18,.76)!important;
  border-bottom:1px solid rgba(86,218,231,.14)!important;
  box-shadow:0 10px 50px rgba(0,0,0,.25);
}
header.scrolled{background:rgba(2,10,18,.94)!important}
.nav{position:relative}
.nav:after{
  content:"";
  position:absolute;
  left:5%;right:5%;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--vfx-cyan),var(--vfx-gold),transparent);
  opacity:.45;
}
.brand{filter:drop-shadow(0 8px 22px rgba(43,214,230,.12))}
.logo{
  background:
    radial-gradient(circle at 35% 25%,rgba(255,255,255,.18),transparent 18%),
    linear-gradient(145deg,#061725,#0a4e61 58%,#0bb7c6)!important;
  border-color:rgba(255,255,255,.20)!important;
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.18),
    0 0 0 1px rgba(43,214,230,.12),
    0 0 35px rgba(43,214,230,.22),
    0 16px 55px rgba(0,0,0,.35)!important;
}
.logo:before{animation:logoRing 4s linear infinite}
@keyframes logoRing{to{transform:rotate(360deg)}}
.brand-text strong{font-size:18px!important;letter-spacing:2px!important}
.brand-text small{color:#829eae!important}
nav a{color:#c7d9e3!important}
nav a:after{background:linear-gradient(90deg,var(--vfx-cyan),var(--vfx-gold))!important}

.hero{
  background:
    radial-gradient(600px 380px at 75% 35%,rgba(43,214,230,.12),transparent 65%),
    radial-gradient(500px 350px at 20% 75%,rgba(215,179,91,.08),transparent 70%),
    linear-gradient(180deg,#020812,#071a2a 72%,#030b14)!important;
  isolation:isolate;
}
.hero:before{
  content:"";
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(115deg,transparent 0 43%,rgba(43,214,230,.07) 50%,transparent 57%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 7px);
  mix-blend-mode:screen;
  animation:heroSweep 12s linear infinite;
}
@keyframes heroSweep{0%{transform:translateX(-4%)}50%{transform:translateX(4%)}100%{transform:translateX(-4%)}}
.hero h1,.hero h2,.hero p,.hero-stats{filter:drop-shadow(0 12px 30px rgba(0,0,0,.3))}
.hero h1 span{background:linear-gradient(90deg,#35dff0,#d7b35b,#35dff0)!important;background-size:220% auto!important;animation:metalText 5s linear infinite}
@keyframes metalText{to{background-position:220% center}}

section{
  position:relative!important;
  overflow:hidden;
  color:var(--vfx-white);
  background:
    radial-gradient(700px 380px at 12% 12%,rgba(43,214,230,.075),transparent 70%),
    radial-gradient(700px 420px at 88% 85%,rgba(215,179,91,.055),transparent 70%),
    linear-gradient(180deg,#06121e,#04101a 55%,#020b14)!important;
  border-top:1px solid rgba(103,220,232,.055);
}
section:before{
  content:"";
  position:absolute;
  width:42vw;height:42vw;max-width:620px;max-height:620px;
  left:-18vw;top:12%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(43,214,230,.09),transparent 68%);
  filter:blur(12px);
  pointer-events:none;
  animation:ambientFloat 12s ease-in-out infinite;
}
section:after{
  content:"";
  position:absolute;
  width:34vw;height:34vw;max-width:520px;max-height:520px;
  right:-15vw;bottom:-8%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(215,179,91,.075),transparent 68%);
  filter:blur(15px);
  pointer-events:none;
  animation:ambientFloat 15s ease-in-out infinite reverse;
}
@keyframes ambientFloat{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(35px,-22px,0) scale(1.08)}
}
.container,.section-head,.hero-inner{position:relative;z-index:3}
.section-head h2{
  color:#f4fbff!important;
  text-shadow:0 12px 35px rgba(0,0,0,.42);
}
.section-head p{color:#8fa8b8!important}
.eyebrow{
  color:var(--vfx-cyan)!important;
  text-shadow:0 0 20px rgba(43,214,230,.22);
}
.eyebrow:before{
  content:"";
  display:inline-block;width:28px;height:1px;
  vertical-align:middle;margin-right:9px;
  background:linear-gradient(90deg,var(--vfx-cyan),var(--vfx-gold));
}

/* About / founder visual depth */
.about-grid,.founder-layout,.contact-grid{position:relative;z-index:3}
.about-copy h3,.founder-title h2{color:#f3fbff!important}
.about-copy p,.founder-title p{color:#91a7b6!important}
.visual,.founder,.card,.job,.contact-box,.candidate-easy-panel,.airtable-connect,.job-portal-status{
  background:
    linear-gradient(145deg,rgba(17,40,55,.82),rgba(4,18,29,.68))!important;
  border:1px solid rgba(113,224,235,.13)!important;
  box-shadow:
    inset 0 1px rgba(255,255,255,.065),
    0 22px 70px rgba(0,0,0,.30)!important;
  backdrop-filter:blur(18px)!important;
  -webkit-backdrop-filter:blur(18px)!important;
}
.visual,.founder,.card,.job,.contact-box{
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .45s;
}
.visual:hover,.founder:hover,.card:hover,.job:hover,.contact-box:hover{
  transform:translateY(-9px) rotateX(1.5deg) rotateY(-1.5deg)!important;
  border-color:rgba(43,214,230,.28)!important;
  box-shadow:
    inset 0 1px rgba(255,255,255,.09),
    0 35px 100px rgba(0,0,0,.44),
    0 0 45px rgba(43,214,230,.06)!important;
}
.visual:after,.card:before,.job:before,.contact-box:before,.founder:after{
  content:"";
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.07) 50%,transparent 75%);
  transform:translateX(-120%);
  transition:transform .8s ease;
}
.visual:hover:after,.card:hover:before,.job:hover:before,.contact-box:hover:before,.founder:hover:after{transform:translateX(120%)}
.float-card{background:rgba(4,16,26,.72)!important;border-color:rgba(43,214,230,.18)!important;box-shadow:0 20px 55px rgba(0,0,0,.38)!important}
.float-card strong{color:#62e6f2!important}
.about,.services,.process,.contact,.jobs,.social{color:var(--vfx-white)!important}
.about-copy .line{background:linear-gradient(90deg,var(--vfx-cyan),var(--vfx-gold))!important}

.services .card h3,.why .card h3,.job h3,.contact-box h3,.step h3{color:#f1f8fc!important}
.services .card p,.job p,.step p,.contact-item span,.contact-item a,.social p{color:#8ea6b5!important}
.icon,.contact-icon,.num{
  background:linear-gradient(145deg,#0a4d62,#0a8795 58%,#d0aa57)!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.12)!important;
  box-shadow:0 10px 30px rgba(0,0,0,.30),0 0 25px rgba(43,214,230,.12)!important;
}
.icon{transform:translateZ(20px);transition:.35s}
.card:hover .icon{transform:translateZ(35px) rotateX(8deg) rotateY(-8deg)}

.why{
  background:
    radial-gradient(650px 400px at 15% 30%,rgba(43,214,230,.10),transparent 68%),
    radial-gradient(650px 400px at 88% 65%,rgba(215,179,91,.08),transparent 68%),
    linear-gradient(180deg,#020a13,#071b2a 50%,#020a13)!important;
}
.why .card{
  background:linear-gradient(145deg,rgba(20,49,65,.64),rgba(3,15,25,.68))!important;
  box-shadow:inset 0 1px rgba(255,255,255,.07),0 25px 65px rgba(0,0,0,.28)!important;
}
.process .step{position:relative;z-index:2}
.process .step:not(:last-child):after{
  content:"";position:absolute;top:44px;left:62%;width:76%;height:1px;
  background:linear-gradient(90deg,rgba(43,214,230,.4),rgba(215,179,91,.25),transparent);
}
.num{animation:stepFloat 4s ease-in-out infinite}
.step:nth-child(2) .num{animation-delay:.4s}.step:nth-child(3) .num{animation-delay:.8s}
.step:nth-child(4) .num{animation-delay:1.2s}.step:nth-child(5) .num{animation-delay:1.6s}
@keyframes stepFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px) rotateY(8deg)}}

.jobs-grid{position:relative;z-index:3}
.job-top .tag{
  color:#071824!important;
  background:linear-gradient(90deg,#52e1ef,#d7b35b)!important;
  box-shadow:0 0 25px rgba(43,214,230,.12);
}
.job-filters input,.job-filters select{
  background:rgba(5,20,32,.78)!important;
  color:#eef8fc!important;
  border-color:rgba(105,219,232,.17)!important;
  box-shadow:inset 0 1px rgba(255,255,255,.05)!important;
  backdrop-filter:blur(12px);
}
.job-filters input::placeholder{color:#7892a2}
.job-filters input:focus,.job-filters select:focus{
  border-color:rgba(43,214,230,.55)!important;
  box-shadow:0 0 0 4px rgba(43,214,230,.07),0 0 35px rgba(43,214,230,.08)!important;
}
.job-portal-status strong,.candidate-notice strong{color:#eef9fc!important}
.job-portal-status span,.candidate-notice span{color:#88a2b1!important}
.candidate-notice{
  background:rgba(43,214,230,.06)!important;
  border-color:rgba(43,214,230,.15)!important;
}
.easy-grid>div{
  background:rgba(5,20,32,.68)!important;
  border-color:rgba(113,224,235,.12)!important;
}
.easy-grid strong{color:#eaf8fb!important}.easy-grid span{color:#829aa9!important}
.easy-note{
  background:rgba(215,179,91,.08)!important;
  border-color:rgba(215,179,91,.20)!important;
  color:#d5c493!important;
}
.airtable-connect{color:#fff!important}
.airtable-connect h3{color:#eef9fc!important}.airtable-connect p{color:#8ba4b2!important}

/* Application section: cinematic shell around the existing application */
.apply-section{
  background:
    radial-gradient(700px 450px at 50% 0%,rgba(43,214,230,.10),transparent 68%),
    linear-gradient(180deg,#020912,#061827 55%,#020912)!important;
}
.form-wrap{
  background:
    linear-gradient(145deg,rgba(12,31,45,.88),rgba(3,14,24,.84))!important;
  border:1px solid rgba(113,224,235,.15)!important;
  box-shadow:0 35px 110px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.07)!important;
  backdrop-filter:blur(22px)!important;
}
.form-head h2{color:#f3fbff!important}
.form-head p{color:#8da6b5!important}
.field label{color:#c9dce6!important}
.field input,.field select,.field textarea{
  background:rgba(3,15,25,.74)!important;
  color:#eef8fc!important;
  border-color:rgba(113,224,235,.15)!important;
}
.field input::placeholder,.field textarea::placeholder{color:#6f8998}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:rgba(43,214,230,.58)!important;
  box-shadow:0 0 0 4px rgba(43,214,230,.07),0 0 35px rgba(43,214,230,.08)!important;
}
.note{color:#819aa9!important}
.charges-hero{
  background:
    radial-gradient(circle at 10% 0%,rgba(43,214,230,.12),transparent 35%),
    linear-gradient(145deg,rgba(11,35,49,.82),rgba(3,15,25,.84))!important;
  border-color:rgba(113,224,235,.16)!important;
  box-shadow:0 25px 75px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.06)!important;
}
.charge-card{background:rgba(255,255,255,.045)!important;border-color:rgba(255,255,255,.10)!important}
.tally-embed-wrap{
  border:1px solid rgba(113,224,235,.16)!important;
  box-shadow:0 30px 90px rgba(0,0,0,.42)!important;
  background:#06111b!important;
  padding:8px;
}
.tally-embed-wrap iframe{border-radius:14px!important}

/* Contact + social */
.contact-box{min-height:100%}
.contact-icon{color:#fff!important}
.social{
  background:
    radial-gradient(500px 260px at 50% 0%,rgba(43,214,230,.08),transparent 70%),
    linear-gradient(180deg,#030c15,#071927)!important;
  border-top:1px solid rgba(113,224,235,.08);
}
.social h2{color:#f3fbff!important}
.socials a{
  background:linear-gradient(145deg,rgba(14,40,54,.82),rgba(3,15,24,.75))!important;
  border:1px solid rgba(113,224,235,.13)!important;
  box-shadow:inset 0 1px rgba(255,255,255,.06),0 20px 55px rgba(0,0,0,.30)!important;
}

/* Global premium buttons */
.btn,.apply,.social-vfx,.wa-float-vfx{
  transform-style:preserve-3d;
}
.btn{
  border:1px solid rgba(255,255,255,.12)!important;
  box-shadow:0 15px 45px rgba(0,0,0,.26),inset 0 1px rgba(255,255,255,.13)!important;
}
.btn.primary{
  background:linear-gradient(120deg,#087eae,#25d2e5 55%,#d4ad55)!important;
  background-size:200% 100%!important;
  animation:buttonMetal 5s ease-in-out infinite;
}
@keyframes buttonMetal{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.btn.ghost:hover{background:rgba(255,255,255,.12)!important;color:#fff!important}

/* Scroll progress + global floating light */
#vfxScrollProgress{
  position:fixed;top:0;left:0;height:2px;width:0;z-index:10001;
  background:linear-gradient(90deg,var(--vfx-cyan),var(--vfx-gold),var(--vfx-cyan));
  box-shadow:0 0 15px rgba(43,214,230,.65);
  pointer-events:none;
}
.vfx-global-orb{
  position:fixed;width:240px;height:240px;border-radius:50%;
  pointer-events:none;z-index:0;opacity:.13;filter:blur(1px);
  background:radial-gradient(circle,rgba(43,214,230,.30),rgba(43,214,230,0) 70%);
  animation:globalOrb 14s ease-in-out infinite;
}
.vfx-global-orb.g2{
  width:180px;height:180px;
  background:radial-gradient(circle,rgba(215,179,91,.24),rgba(215,179,91,0) 70%);
  animation-duration:18s;animation-delay:-7s;
}
@keyframes globalOrb{
  0%,100%{transform:translate3d(0,0,0)}
  35%{transform:translate3d(38vw,18vh,0)}
  70%{transform:translate3d(8vw,65vh,0)}
}

/* Make the whole page feel like one connected cinematic scene */
.about,.founders,.services,.why,.process,.jobs,.apply-section,.contact,.social{
  isolation:isolate;
}
.about .container,.founders .container,.services .container,.why .container,
.process .container,.jobs .container,.apply-section .container,.contact .container,.social .container{
  transform-style:preserve-3d;
}
.section-head h2{
  background:linear-gradient(100deg,#f4fbff 15%,#c6e9ef 45%,#d7b35b 78%,#f4fbff);
  background-size:220% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent!important;
  animation:sectionMetal 7s linear infinite;
}
@keyframes sectionMetal{to{background-position:220% center}}

@media(max-width:900px){
  .process .step:not(:last-child):after{display:none}
}
@media(max-width:600px){
  body:after{background-size:34px 34px;opacity:.14}
  section{padding-top:85px;padding-bottom:85px}
  .section-head h2{font-size:34px}
  .brand-text strong{font-size:15px!important}
  .visual:hover,.founder:hover,.card:hover,.job:hover,.contact-box:hover{
    transform:translateY(-5px)!important;
  }
  .vfx-global-orb{opacity:.08}
}
@media(prefers-reduced-motion:reduce){
  body:after,.hero:before,.hero h1 span,.section-head h2,.num,.btn.primary,.vfx-global-orb,.vfx-global-orb.g2{animation:none!important}
}

  </style>
